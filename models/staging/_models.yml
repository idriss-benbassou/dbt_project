version: 2

groups:
  - name: finance
    owner:
      name: Idriss Benbassou

models:
  - name: stg_customers
    description: "Clients nettoyés depuis la source brute. Un client par ligne."
    config:
      group: finance
      access: protected
    columns:
      - name: customer_id
        description: "{{ doc('customer_id') }}"
        data_tests:
          - unique
          - not_null
      - name: email
        description: "Email du client, mis en minuscules."
        data_tests:
          - not_null

  - name: stg_orders
    description: "Commandes nettoyées depuis la source brute. Une commande par ligne."
    config:
      group: finance
      access: protected
    columns:
      - name: order_id
        description: "Identifiant unique de la commande."
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: "{{ doc('customer_id') }}"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: statut
        description: "Statut de la commande : completed ou pending."
        data_tests:
          - accepted_values:
              arguments:
                values: ['completed', 'pending']
      - name: montant
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0