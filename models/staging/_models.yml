version: 2

groups:
  - name: finance
    owner:
      name: Idriss Benbassou

models:
  - name: stg_customers
    description: "Clients nettoyés depuis la source brute. Un client par ligne."
    config:
      group: finance
      access: protected
    columns:
      - name: customer_id
        description: "{{ doc('customer_id') }}"
        data_tests:
          - unique
          - not_null
      - name: email
        description: "Email du client, mis en minuscules."
        data_tests:
          - not_null

  - name: stg_orders
    description: "Commandes nettoyées depuis la source brute. Une commande par ligne."
    config:
      group: finance
      access: protected
    columns:
      - name: order_id
        description: "Identifiant unique de la commande."
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: "{{ doc('customer_id') }}"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: statut
        description: "Statut de la commande. La liste des statuts autorisés vit dans le seed statuts_commande."
        data_tests:
          # Le seed est la seule référence des statuts (module 7) :
          # il remplace la liste écrite en dur dans accepted_values (module 5).
          - relationships:
              arguments:
                to: ref('statuts_commande')
                field: statut
      - name: montant
        description: "Montant de la commande en euros, toujours strictement positif."
        data_tests:
          # Même règle que le test singulier tests/assert_montant_positif.sql,
          # écrite en une ligne grâce à dbt_utils (module 12).
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false
