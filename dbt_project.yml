name: 'dbt_projet'
version: '1.0.0'

# Le profil de connexion à utiliser (défini dans profiles.yml)
profile: 'dbt_projet'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# La règle par défaut se fixe par dossier.
# Un config() dans un modèle ne sert qu'aux exceptions (voir mart_orders.sql).
models:
  dbt_projet:
    +persist_docs:
      relation: true
      columns: true
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table

seeds:
  dbt_projet:
    statuts_commande:
      +column_types:
        statut: varchar
        libelle: varchar
        est_paye: boolean
